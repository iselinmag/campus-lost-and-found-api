name: Backend CI

on:
  push:
    branches:
      - main
      - deploy/production
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-security:
    name: Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk security scan
        run: npm run security:snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t campus-lost-and-found-api:${{ github.sha }} .
  deliver:
    name: Deliver to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/production'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for Docker Hub
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/campus-lost-and-found-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/campus-lost-and-found-api:latest \
            .

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/campus-lost-and-found-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/campus-lost-and-found-api:latest
